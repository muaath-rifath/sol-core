services:
  traefik:
    image: traefik:v2.11
    container_name: sol-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--providers.file.directory=/traefik/conf"
      - "--providers.file.watch=true"
    extra_hosts:
      - "host-gateway:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOCKER_API_VERSION=1.41
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/acme.json:/acme/acme.json
      - ./traefik/conf:/traefik/conf:ro
      - ./certs:/certs:ro
    networks:
      - sol-net

  sol-core:
    build: .
    container_name: sol-core
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - sol-net
    volumes:
      - ./certs:/certs:ro
    labels:
      - "traefik.enable=true"
      # Main API routes — ForwardAuth validates Bearer token via Zitadel
      - "traefik.http.routers.sol.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.sol.entrypoints=websecure"
      - "traefik.http.routers.sol.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sol.middlewares=sol-auth"
      - "traefik.http.routers.sol.service=sol-svc"
      - "traefik.http.middlewares.sol-auth.forwardauth.address=${OIDC_ISSUER}/oidc/v1/userinfo"
      - "traefik.http.middlewares.sol-auth.forwardauth.authRequestHeaders=Authorization"
      # Public invitation endpoints — no auth (token is the secret)
      - "traefik.http.routers.sol-public.rule=Host(`${API_DOMAIN}`) && PathPrefix(`/api/v1/invitations/`)"
      - "traefik.http.routers.sol-public.entrypoints=websecure"
      - "traefik.http.routers.sol-public.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sol-public.priority=200"
      - "traefik.http.routers.sol-public.service=sol-svc"
      # Health check — no auth
      - "traefik.http.routers.sol-health.rule=Host(`${API_DOMAIN}`) && Path(`/healthz`)"
      - "traefik.http.routers.sol-health.entrypoints=websecure"
      - "traefik.http.routers.sol-health.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sol-health.service=sol-svc"
      # Device OTA firmware download (mTLS protected)
      - "traefik.http.routers.sol-ota.rule=Host(`ota.sol.muaathrifath.me`) && PathPrefix(`/api/v1/ota/attempts/`)"
      - "traefik.http.routers.sol-ota.entrypoints=websecure"
      - "traefik.http.routers.sol-ota.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sol-ota.tls.options=mtls@file"
      - "traefik.http.routers.sol-ota.middlewares=mtls-header@file"
      - "traefik.http.routers.sol-ota.service=sol-svc"
      # Service definition
      - "traefik.http.services.sol-svc.loadbalancer.server.port=8080"

  sol-builder:
    build:
      context: ./sol-builder
    container_name: sol-builder
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SOL_API_URL=http://sol-core:8080
      - FIRMWARE_SRC_DIR=/firmware
    volumes:
      - ./firmware:/firmware
    depends_on:
      - redis
    networks:
      - sol-net

  postgres:
    build:
      context: .
      dockerfile: postgres.Dockerfile
    container_name: sol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sol
      POSTGRES_PASSWORD: sol
      POSTGRES_DB: sol
      PATRONI_POSTGRESQL_PARAMETERS_SHARED_BUFFERS: 512MB
      PATRONI_POSTGRESQL_PARAMETERS_WORK_MEM: 8MB
      PATRONI_POSTGRESQL_PARAMETERS_MAINTENANCE_WORK_MEM: 128MB
      PATRONI_POSTGRESQL_PARAMETERS_EFFECTIVE_CACHE_SIZE: 1536MB
    volumes:
      - pg_data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sol -d sol"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1800m
    mem_reservation: 900m
    networks:
      - sol-net

  redis:
    image: redis:7-alpine
    container_name: sol-redis-queue
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 320m
    mem_reservation: 128m
    networks:
      - sol-net

  minio:
    image: minio/minio:latest
    container_name: sol-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    mem_limit: 700m
    mem_reservation: 256m
    networks:
      - sol-net

networks:
  sol-net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  minio_data:
