services:
  traefik:
    image: traefik:v2.11
    container_name: sol-traefik
    restart: unless-stopped
    profiles: ["edge"]
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--providers.file.directory=/traefik/conf"
      - "--providers.file.watch=true"
      - "--accesslog=true"
    extra_hosts:
      - "host-gateway:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOCKER_API_VERSION=1.41
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/acme.json:/acme/acme.json
      - ./infra/traefik/conf:/traefik/conf:ro
      - ./certs:/certs:ro
    networks:
      - sol-net

  sol-core:
    build:
      context: ./apps/core
    container_name: sol-core
    restart: unless-stopped
    env_file:
      - path: .env.example
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      vernemq:
        condition: service_healthy
      init-certs:
        condition: service_completed_successfully
    networks:
      - sol-net
    ports:
      - "8080:8080"
    volumes:
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
    labels:
      - "traefik.enable=true"
      # Main API routes — ForwardAuth validates Bearer token via Zitadel
      - "traefik.http.routers.sol.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.sol.entrypoints=websecure"
      - "traefik.http.routers.sol.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sol.middlewares=sol-auth"
      - "traefik.http.routers.sol.service=sol-svc"
      - "traefik.http.middlewares.sol-auth.forwardauth.address=${OIDC_ISSUER}/oidc/v1/userinfo"
      - "traefik.http.middlewares.sol-auth.forwardauth.authRequestHeaders=Authorization"
      # Public invitation endpoints — no auth (token is the secret)
      - "traefik.http.routers.sol-public.rule=Host(`${API_DOMAIN}`) && PathPrefix(`/api/v1/invitations/`)"
      - "traefik.http.routers.sol-public.entrypoints=websecure"
      - "traefik.http.routers.sol-public.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sol-public.priority=200"
      - "traefik.http.routers.sol-public.service=sol-svc"
      # Health check — no auth
      - "traefik.http.routers.sol-health.rule=Host(`${API_DOMAIN}`) && Path(`/healthz`)"
      - "traefik.http.routers.sol-health.entrypoints=websecure"
      - "traefik.http.routers.sol-health.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sol-health.service=sol-svc"
      # All WebSocket upgrades — browsers cannot send Authorization on WS; auth handled by sol-core via ?token=
      - "traefik.http.routers.sol-ws.rule=Host(`${API_DOMAIN}`) && Headers(`Upgrade`, `websocket`)"
      - "traefik.http.routers.sol-ws.entrypoints=websecure"
      - "traefik.http.routers.sol-ws.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sol-ws.priority=200"
      - "traefik.http.routers.sol-ws.service=sol-svc"
      # Device OTA firmware download (mTLS protected)
      - "traefik.http.routers.sol-ota.rule=Host(`ota.sol.muaathrifath.me`) && PathPrefix(`/api/v1/ota/attempts/`)"
      - "traefik.http.routers.sol-ota.entrypoints=websecure"
      - "traefik.http.routers.sol-ota.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sol-ota.tls.options=mtls@file"
      - "traefik.http.routers.sol-ota.middlewares=mtls-header@file"
      - "traefik.http.routers.sol-ota.service=sol-svc"
      # Service definition
      - "traefik.http.services.sol-svc.loadbalancer.server.port=8080"
      - "traefik.docker.network=sol-net"

  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.migrate
    container_name: sol-migrate
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      GOOSE_DBSTRING: postgres://sol:sol@postgres:5432/sol?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/core/migrations:/migrations
    networks:
      - sol-net
    restart: "no"

  sol-agent:
    build:
      context: ./apps/agent
    container_name: sol-agent
    restart: unless-stopped
    profiles: ["voice"]
    env_file:
      - path: .env.example
      - path: .env
        required: false
    depends_on:
      - sol-core
    networks:
      - sol-net

  init-certs:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dev-certs
    container_name: sol-init-certs
    volumes:
      - ./certs:/certs
    restart: "no"

  sol-nextjs:
    build:
      context: ./apps/web
    container_name: sol-nextjs
    restart: unless-stopped
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      SOL_CORE_URL: http://sol-core:8080
    ports:
      - "3000:3000"
    depends_on:
      sol-core:
        condition: service_healthy
    networks:
      - sol-net

  sol-builder:
    build:
      context: ./apps/builder
    container_name: sol-builder
    restart: unless-stopped
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SOL_API_URL=http://sol-core:8080
      - FIRMWARE_SRC_DIR=/firmware
    volumes:
      - ./packages/firmware:/firmware
    depends_on:
      - redis
    networks:
      - sol-net

  postgres:
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    container_name: sol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sol
      POSTGRES_PASSWORD: sol
      POSTGRES_DB: sol
      PATRONI_POSTGRESQL_PARAMETERS_SHARED_BUFFERS: 512MB
      PATRONI_POSTGRESQL_PARAMETERS_WORK_MEM: 8MB
      PATRONI_POSTGRESQL_PARAMETERS_MAINTENANCE_WORK_MEM: 128MB
      PATRONI_POSTGRESQL_PARAMETERS_EFFECTIVE_CACHE_SIZE: 1536MB
    volumes:
      - pg_data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sol -d sol"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1800m
    mem_reservation: 900m
    networks:
      - sol-net

  redis:
    image: redis:7-alpine
    container_name: sol-redis-queue
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 320m
    mem_reservation: 128m
    networks:
      - sol-net

  vernemq:
    image: vernemq/vernemq:2.2.0-alpine
    container_name: sol-vernemq
    restart: unless-stopped
    environment:
      DOCKER_VERNEMQ_ACCEPT_EULA: "yes"
      DOCKER_VERNEMQ_ALLOW_ANONYMOUS: "on"
      DOCKER_VERNEMQ_LOG__CONSOLE: "both"
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "vmq-admin cluster show"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - sol-net

  minio:
    image: minio/minio:latest
    container_name: sol-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    mem_limit: 700m
    mem_reservation: 256m
    networks:
      - sol-net

networks:
  sol-net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  minio_data:
